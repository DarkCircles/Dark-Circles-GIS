<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>HWR JavaScript Test Map</title>

    <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
    <script type="module" src="https://js.arcgis.com/5.1/"></script>

    <!-- Configure the IdentityManager before ArcGIS Map Components load -->
    <script type="module">
      const [config, identityManager, OAuthInfo] = await $arcgis.import([
        "@arcgis/core/config.js",
        "@arcgis/core/identity/IdentityManager.js",
        "@arcgis/core/identity/OAuthInfo.js",
      ]);

      // Configure the portal URL and OAuth settings
      // Replace with your actual Portal URL
      config.portalUrl = "https://gis.174powerglobal.com/portal";
      const oAuthInfo = new OAuthInfo({
        // Replace with your actual App ID
        appId: "a2cAR3XwS1gKerjz",
        // Set the portalUrl if using a portal other than ArcGIS Online.
        portalUrl: config.portalUrl
      });
      identityManager.registerOAuthInfos([oAuthInfo]);


      const mapElement = document.querySelector("arcgis-map");
      // Wait for the map component to be ready
      await mapElement.viewOnReady();

      const view = mapElement.view;
      const webmap = view.map;

      // Get project_number from URL
      const params = new URLSearchParams(window.location.search);
      const projectNumber = params.get("project_number");

      if (projectNumber) {
      
      // Find your layer by its title in the web map
      const featureLayer = webmap.allLayers.find(
      layer => layer.title === "⏹️ Project Active in Procore"
      );
      
      if (!featureLayer) {
      console.error("Layer not found");
      } else {
      
      const query = featureLayer.createQuery();
      query.where = `project_number = '${projectNumber}'`;
      query.returnGeometry = true;
      query.outFields = ["*"];
      
      const results = await featureLayer.queryFeatures(query);
      
      if (results.features.length > 0) {
      const feature = results.features[0];
      
      // Zoom to the feature
      await view.goTo(feature);

      // Dock popup
      view.popup.dockEnabled = true;
      view.popup.dockOptions = {
      buttonEnabled: true,
      breakpoint: false,
      position: "bottom-right"
      };
      
      // Open popup
      view.openPopup({
      features: [feature]
      });

      console.log(`Zoomed to project ${projectNumber}`);
      } else {
      console.warn(`Project not found: ${projectNumber}`);
          }
        }
      }

      webmap.allLayers.forEach(layer => {
      console.log(layer.title);
      });

    </script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <!-- Note: popup-component-enabled enables the Popup component (beta). See https://developers.arcgis.com/javascript/latest/references/map-components/components/arcgis-map/#popupComponentEnabled for details. -->
    <arcgis-map item-id="e8c7bdf86451477586d6f89ff99a51cb" popup-component-enabled>
      <arcgis-search slot="top-right"></arcgis-search>
      <arcgis-basemap-toggle
        slot="top-right"
        view="Map"
        next-basemap="topo-vector"
      ></arcgis-basemap-toggle>
        <arcgis-layer-list
          slot="bottom-left"
          view="Map"
          selection-mode="none"
          visibility-appearance="checkbox"
          drag-enabled
          collapsed
        ></arcgis-layer-list>
    </arcgis-map>
  </body>
</html>
